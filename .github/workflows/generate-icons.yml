name: Generate hedgehog app icons
on:
  push:
    paths:
      - 'icons/hedgehog.webp'
      - '.github/workflows/generate-icons.yml'
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PNG app icons from original mascot
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          original = Image.open('icons/hedgehog.webp').convert('RGBA')
          for size in (192, 512):
              canvas = Image.new('RGBA', (size, size), '#eee4ff')
              mascot = original.copy()
              mascot.thumbnail((int(size * .91), int(size * .91)), Image.Resampling.LANCZOS)
              canvas.alpha_composite(mascot, ((size - mascot.width)//2, (size - mascot.height)//2))
              canvas.convert('RGB').save(f'icons/icon-{size}.png', optimize=True)
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          git diff --cached --quiet || (git commit -m "Generate original hedgehog PNG app icons" && git push)
